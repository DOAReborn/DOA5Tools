[DOA5Tools]
; 1 = on, 0 = off.
Lobby=1
JoinFix=1
Rematch=1
WiFiWired=1
Borderless=1
; Experimental: 120/144 fps in fights (F3).
HighFps=0
Skip=1
; Game runs at your desktop resolution ([Ultrawide] below).
Ultrawide=1
ReplayMenu=1
; Lobby text chat (Start / Enter in a lobby). Everyone in the lobby needs it.
LobbyChat=1
; Extra stage slots: the 5 PS4 stages.
StageSlots=1
; Skip character intros (Cross) and the victory pose (Cross / Start).
IntroOutroSkip=1
; Lobby names in the lobby list, and a text box for the ROOM name.
LobbyName=1
; Attack on Titan Power Blow fixes (online: only if everyone has them).
AoTFix=1
; PS4 round restart points on the console stages (online: only if everyone has them).
ConsoleRestart=1
; Console stages in Arcade, Time Attack and Survival.
ArcadeConsole=1
; Lobby CONNECTION setting (host), working Kick button, kicked players can't come back.
ConnFilter=1
; Mod options menu in the main menu (offline).
ModOptions=1
; Controllers the game does not know get the right buttons; keyboard keys ([Keyboard], Controls in DOA5Installer).
Gamepad=1
; 1 = writes DOA5Tools.log next to this file (no personal data).
Log=0

[Rematch]
; Random characters/stage at a rematch (host's setting): 1 = new draw, 0 = same as last fight.
Tirage=1
; Host only: wait before starting a rematch (ms, max 10000) so spectators can follow.
DelaiRematch=1000

[Borderless]
; 2 = borderless fullscreen, 1 = window, 0 = game setting. F11 cycles the modes.
Mode=2

[Ultrawide]
; Resolution. 0 = your desktop resolution.
Width=0
Height=0

[ReplayMenu]
; Deleted replays: 1 = moved to a REPLY_CORBEILLE folder next to REPLY_SAVE, 0 = erased for good.
Recycle=1

[HighFps]
; Fps cap (0 = no cap). F3 turns it on / off in game.
Fps=120
; 1 = intros and win poses at 60 online too (both players need HighFps).
ScenesEnLigne=0

[StageSlots]
; 1 = PS4 stages shown (online: only if everyone has them).
Extra=1
; 1 = PS4 tile order (Dojo after the PS4 stages), 0 = Dojo before them.
PS4Order=1

[IntroOutroSkip]
; 1 = on, 0 = off.
Intro=1
Outro=1
; P1 / P2 marks on the end-of-match menu choices.
Marks=1

[AoTFix]
; 1 = wall in front of the Titan comes back. 1 = K.O. on the Titan's hand, like PS4.
Wall=1
KOOnHand=1

[ArcadeConsole]
Arcade=1
TimeAttack=1
Survival=1

[Gamepad]
; 1 = arcade sticks and hitboxes in PS4/PS5 mode get the PlayStation layout.
SonyLikeAuto=1
; 1 = Xbox LT and RT read separately.
SplitTriggers=1
; 1 = says once at startup when Steam Input is on.
SteamInputNotice=1

[Keyboard]
; Set with the Controls button of DOA5Installer. Empty = the game's key.

[LobbyName]
; Last ROOM name typed (filled by the mod).
Name=
