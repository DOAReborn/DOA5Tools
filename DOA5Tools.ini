[DOA5Tools]
; 1 = on, 0 = off.
Lobby=1
JoinFix=1
Rematch=1
WiFiWired=1
Borderless=1
; Needs AutoLink (not included). Without it, this does nothing.
60fps=1
Skip=1
; Game runs at your desktop resolution ([Ultrawide] below).
Ultrawide=1
ReplayMenu=1
; Lobby text chat (Start / Enter in a lobby). Everyone in the lobby needs it.
LobbyChat=1
; Extra stage slots: Lab (Destroyed) + the 5 PS4 stages.
StageSlots=1
; Skip character intros (Cross) and the victory pose (Cross / Start).
IntroOutroSkip=1
; Lobby names in the lobby list, and a text box for the ROOM name.
LobbyName=1
; 1 = writes DOA5Tools.log next to this file (no personal data).
Log=0

[Rematch]
; Random characters/stage at a rematch (host's setting): 1 = new draw, 0 = same as last fight.
Tirage=1

[Borderless]
; 2 = borderless fullscreen, 1 = window, 0 = game setting. F11 cycles the modes.
Mode=2

[Ultrawide]
; Resolution. 0 = your desktop resolution.
Width=0
Height=0

[ReplayMenu]
; Deleted replays: 1 = moved to a REPLY_CORBEILLE folder next to REPLY_SAVE, 0 = erased for good.
Recycle=1

[StageSlots]
; 1 = PS4 stages shown (online: only if everyone has them).
Extra=1

[IntroOutroSkip]
; 1 = on, 0 = off.
Intro=1
Outro=1
; P1 / P2 marks on the end-of-match menu choices.
Marks=1

[LobbyName]
; Last ROOM name typed (filled by the mod).
Name=
