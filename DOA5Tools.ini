[DOA5Tools]
; 1 = on, 0 = off (an off module installs nothing).
Lobby=1
JoinFix=1
Rematch=1
WiFiWired=1
Borderless=1
; 60fps needs AutoLink (not included). Without it, this does nothing.
60fps=1
Skip=1
; Ultrawide / non-16:9 screens: custom resolution + HUD fix (based on DOA5LRFix by Lyall, MIT).
; Does nothing on a 16:9 screen unless Width/Height are set below.
Ultrawide=1
; 1 = local log DOA5Tools.log next to this file (events and counts only, no IDs). 0 = no log.
Log=0

[JoinFix]
; KeyFix: repairs the room's network key before it is published (otherwise ~1 room in 11 cannot be joined). Keep it on.
KeyFix=1
; InviteRetry: after you accept an invite, asks Steam again for the room data if it does not arrive.
InviteRetry=1
; key that copies the steam://joinlobby link of your room to the clipboard. 118 = F7, 0 = none.
CopyLinkKey=118

[Rematch]
; Random characters/stage at a rematch (only the host's setting counts): 1 = new draw, 0 = same as last fight.
Tirage=1
; wait of the host (ms) before relaunching (0 to 10000).
DelaiRematch=0
; 1 = the "Search Menu" entry of the after-fight menu is called "Quit".
LibelleQuit=1

[Borderless]
; 2 = borderless fullscreen, 1 = classic window, 0 = the game's own setting.
Mode=2
; key that cycles Borderless (1 beep) -> Window (2 beeps) -> Fullscreen (3 beeps, next launch). F1..F24 or 0.
ToggleKey=F11

[60fps]
; offline only: Menus, Intros, WinPoses, Story (1 = 60 fps).
Menus=1
Intros=1
WinPoses=1
Story=1

[Ultrawide]
; Custom resolution (needed for ultrawide). Width/Height = 0 -> your desktop resolution.
CustomResolution=1
Width=0
Height=0
; Fixes the stretched HUD, input guide and movies on non-16:9 screens.
FixHUD=1
